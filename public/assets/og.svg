    <circle cx="28" cy="28" r="6" fill="#ff5f57"/><circle cx="50" cy="28" r="6" fill="#febc2e"/><circle cx="72" cy="28" r="6" fill="#28c840"/>
    <text x="26" y="86" font-size="19" fill="#00ff88">$ curl parkzone.in/gpu</text>
    <text x="26" y="124" font-size="19" fill="#a7b3ae">RTX 4090  24GB  Mumbai   Rs 29/hr</text>
    <text x="26" y="158" font-size="19" fill="#a7b3ae">RTX 3090  24GB  Pune     Rs 19/hr</text>
    <text x="26" y="192" font-size="19" fill="#a7b3ae">A100 80GB       Delhi    Rs 74/hr</text>
    <text x="26" y="240" font-size="19" fill="#00ff88">ssh root@parkzone.in -p 22001</text>
    <text x="26" y="276" font-size="17" fill="#6d7a75">billed per minute, cancel anytime</text>

# ParkZone - parkzone.in ONLY. Copy to /etc/nginx/sites-available/parkzone
#     sudo cp ops/pz-security-headers.conf /etc/nginx/snippets/pz-security-headers.conf
#     sudo ln -sf /etc/nginx/sites-available/parkzone /etc/nginx/sites-enabled/parkzone
#     sudo nginx -t && sudo systemctl reload nginx
# SINGLE DOMAIN RULE: never add api.parkzone.in / app.parkzone.in / staging.*

# --- per-IP throttling (http context, so it lives outside the server block) ---
limit_req_zone $binary_remote_addr zone=pz_api_read:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=pz_api_write:10m rate=3r/s;
limit_conn_zone $binary_remote_addr zone=pz_conn:10m;

# --- TLS baseline (certbot will also drop in its own options file) ---
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

server {
    listen 80;
    listen [::]:80;
    server_name parkzone.in www.parkzone.in;

    # certbot webroot challenge must stay reachable over plain HTTP
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location = /healthz { access_log off; return 200 "ok\n"; }
    location / { return 301 https://parkzone.in$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.parkzone.in;

    ssl_certificate     /etc/letsencrypt/live/parkzone.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parkzone.in/privkey.pem;

    return 301 https://parkzone.in$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name parkzone.in;

    ssl_certificate     /etc/letsencrypt/live/parkzone.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parkzone.in/privkey.pem;

    root /var/www/parkzone/public;
    index index.html;

    charset utf-8;
    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 15s;

    access_log /var/log/nginx/parkzone.access.log;
    error_log  /var/log/nginx/parkzone.error.log warn;

    limit_conn pz_conn 30;

    # Never serve dotfiles, source maps or the raw env files
    location ~ /\.(?!well-known) { deny all; access_log off; }
    # NOTE: the (?!api/) lookahead keeps /api/openapi.json reachable - a plain
    # \.json\$ deny rule would shadow the proxied API because regex locations win.
    location ~* ^/(?!api/).*\.(env|py|pyc|sql|bak|log|md|json|ya?ml|lock|toml|ini)$ { deny all; access_log off; }

    # ---- API: prefix is PRESERVED (no trailing slash on proxy_pass) --------
    # FastAPI declares /api/*, so stripping the prefix here would 404 every call.
    location ~ ^/api/(rent|stop|heartbeat|wallet/add)$ {
        limit_req zone=pz_api_write burst=6 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/pz-security-headers.conf;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_no_cache 1;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        limit_req zone=pz_api_read burst=40 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/pz-security-headers.conf;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_no_cache 1;
        add_header Cache-Control "no-store" always;
    }

    # ---- Static assets: content-hashed, safe to cache forever ---------------
    location /assets/ {
        include /etc/nginx/snippets/pz-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # ---- Host agent download (Windows) -------------------------------------
    location = /agent.exe {
        include /etc/nginx/snippets/pz-security-headers.conf;
        add_header Cache-Control "public, max-age=300" always;
        add_header Content-Disposition "attachment; filename=ParkZoneAgent.exe" always;
        default_type application/octet-stream;
        try_files /agent.exe =404;
    }

    # ---- Clean URLs: parkzone.in/host instead of /host.html -----------------
    location ~ ^/(host|dashboard|status|terms|privacy|refund)$ {
        include /etc/nginx/snippets/pz-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /$1.html =404;
    }

    location = / {
        include /etc/nginx/snippets/pz-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # Unknown paths must 404 (no soft-404 SPA fallback) - good for SEO and trust
    location / {
        include /etc/nginx/snippets/pz-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
        error_page 404 /404.html;
    }

    # ---- Compression --------------------------------------------------------
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml application/manifest+json;
    # Brotli if the module is compiled in (nginx-extras / libnginx-mod-brotli):
    # brotli on; brotli_comp_level 5; brotli_types text/css application/javascript application/json image/svg+xml;
}

# SINGLE DOMAIN RULE: parkzone.in and nothing else. No api.*, no app.*, no www
# content, no staging subdomain. Everything is served from this one server block.

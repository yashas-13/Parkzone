<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="ParkZone - Indian GPUs for Indian AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070a"/><stop offset="60%" stop-color="#061014"/><stop offset="100%" stop-color="#04150d"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.35"/><stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="60%" stop-color="#00ff88"/><stop offset="100%" stop-color="#5fe9ff"/>
    </linearGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0v46" fill="none" stroke="#00ff88" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#orb)"/>
  <rect x="72" y="72" width="1056" height="486" rx="28" fill="#ffffff" fill-opacity="0.03" stroke="#00ff88" stroke-opacity="0.25"/>
  <g transform="translate(116,132)">
    <rect width="56" height="56" rx="16" fill="#00ff88"/>
    <path d="M14 42V14h11.5c6 0 10 3.6 10 9.2 0 5.7-4 9.3-10 9.3H20.5V42H14zm6.5-12.4h4c2.4 0 3.8-1.4 3.8-3.8s-1.4-3.8-3.8-3.8h-4v7.6z" fill="#04160c"/>
    <text x="76" y="38" font-family="Inter,Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="#eef2f0">PARK<tspan fill="#00ff88">ZONE</tspan><tspan fill="#6d7a75" font-size="19">.in</tspan></text>
  </g>
  <text x="116" y="292" font-family="Inter,Helvetica,Arial,sans-serif" font-size="74" font-weight="900" fill="#eef2f0">Indian GPUs for</text>
  <text x="116" y="376" font-family="Inter,Helvetica,Arial,sans-serif" font-size="74" font-weight="900" fill="url(#ink)">Indian AI.</text>
  <text x="116" y="438" font-family="Inter,Helvetica,Arial,sans-serif" font-size="27" fill="#a7b3ae">RTX 4090 from Rs 29/hr - about 70% cheaper than AWS. Per-minute billing, UPI, made in India.</text>
  <g transform="translate(116,470)">
    <rect width="184" height="58" rx="14" fill="#00ff88"/>
    <text x="92" y="37" text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#04160c">Rent a GPU</text>
    <rect x="204" y="0" width="230" height="58" rx="14" fill="none" stroke="#00ff88" stroke-opacity="0.5"/>
    <text x="319" y="37" text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#00ff88">Park your GPU</text>
  </g>
  <g transform="translate(700,196)" font-family="JetBrains Mono,monospace">

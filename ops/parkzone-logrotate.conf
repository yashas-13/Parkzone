# Log rotation for hosts running the agent outside systemd.
# Install: sudo cp ops/parkzone-logrotate.conf /etc/logrotate.d/parkzone
/var/www/parkzone/backend/*.log /var/log/parkzone*.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    copytruncate
    su parkzone parkzone
}
